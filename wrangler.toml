name = "kerbside"
main = "src/worker.js"
compatibility_date = "2025-09-01"
keep_vars = true

# The app (index.html, drive.js, hang.js, icons, manifest, sw.js) is served from /public.
# Anything that isn't a file there (/ws, /status, /track, /room, /hang, /ice) goes to the Worker.
[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "F1Relay"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RaceRoom"

[[durable_objects.bindings]]
name = "HANG"
class_name = "HangRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["F1Relay"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RaceRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["HangRoom"]

# Every 15 minutes: circuit weather and alerts. Once an hour (first run each hour): save circuit outlines
# from OpenF1 ahead of time, so tracks load even when OpenF1 is locked.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
